#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "aspnetcore"
name = "Asp.Net Core"
description.en = "Web api using Asp.Net core to run your .net app"
description.fr = "Une web api Asp.Net core qui vous permet de déployer votre application .net"

version = "9.0.2~ynh1"

maintainers = ["elblaa"]

[upstream]
license = "MIT"
website = "https://asp.net"
userdoc = "https://learn.microsoft.com/fr-fr/aspnet/core/introduction-to-aspnet-core?view=aspnetcore-9.0"
code = "https://github.com/dotnet/aspnetcore"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

# FIXME: replace with an **estimate** minimum disk and RAM requirements. e.g. 20M, 400M, 1G...
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/api"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.system_user]
    
    [resources.apt]
    extras.microsoft.repo = "deb https://packages.microsoft.com/debian/12/prod/ bookworm main"
    extras.microsoft.key = ""
    extras.microsoft.packages = ["aspnetcore-runtime-9.0"]

    [resources.sources]

        [resources.sources.main]
        amd64.url = "https://github.com/elblaa/sample_aspnetcore_ynh/releases/download/v1.0.0/dotnet-yunohost-sample-1.0.0-linux-arm.tar.gz"
        #todo setup sha256 from release
        amd64.sha256 = "8d40bbb6a39d4db629bf3aca00aaa8326be64f72a64bcc5acc143a9bd341f420"
        armhf.url = "https://github.com/elblaa/sample_aspnetcore_ynh/releases/download/v1.0.0/dotnet-yunohost-sample-1.0.0-linux-arm.tar.gz"
        armhf.sha256 = "d30b26de63c1aa5ffbec6cee4348f28e0a57015e40b95f8c04c6f8138c0794d5"
        arm64.url = "https://github.com/elblaa/sample_aspnetcore_ynh/releases/download/v1.0.0/dotnet-yunohost-sample-1.0.0-linux-arm64.tar.gz"
        arm64.sha256 = "14179883b60d8b35fd4c494d5cd73a03750aa2110610e743174d026491799c64"
        in_subdir = false

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = ".*-linux-x64.tar.gz"
        autoupdate.asset.armhf = ".*-linux-arm.tar.gz"
        autoupdate.asset.arm64 = ".*-linux-arm64.tar.gz"

    [resources.permissions]
    main.url = "/"

    [resources.install_dir]

    [resources.ports]

    
